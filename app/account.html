<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>霓虹跑酷 · 本地账户</title><style>body{margin:0;background:#08051a;color:#fff;font-family:Arial,'Microsoft Yahei';padding:30px}main{max-width:620px;margin:auto}section{background:#120d2b;border:1px solid #52f5ff88;padding:22px;margin:14px 0;box-shadow:0 0 25px #52f5ff22}h1{color:#52f5ff}input,button{padding:11px;margin:5px;border-radius:4px;border:1px solid #675b91;background:#0a071d;color:#fff}button{cursor:pointer;background:#382080}li{margin:9px 0;color:#ddd}</style><main><h1>NEON RUN · 本地账户</h1><section><h2>注册 / 登录</h2><input id="name" placeholder="用户名"><input id="pass" type="password" placeholder="密码"><button onclick="signup()">注册</button><button onclick="login()">登录</button><p id="msg"></p></section><section><h2>当前用户：<span id="user">未登录</span></h2><input id="newscore" type="number" placeholder="模拟提交分数"><button onclick="submitScore()">提交战绩</button><h3>我的历史战绩</h3><ol id="history"></ol></section><section><h2>🏆 本地排行榜</h2><ol id="rank"></ol></section></main><script>const K='neon-users',users=()=>JSON.parse(localStorage[K]||'{}'),save=o=>localStorage[K]=JSON.stringify(o),me=()=>localStorage.getItem('neon-current');function signup(){let n=name.value.trim(),p=pass.value;if(!n||!p)return msg.textContent='请输入用户名和密码';let u=users();if(u[n])return msg.textContent='用户已存在';u[n]={pass:p,scores:[]};save(u);msg.textContent='注册成功，请登录'}function login(){let n=name.value.trim(),p=pass.value,u=users();if(!u[n]||u[n].pass!==p)return msg.textContent='用户名或密码错误';localStorage.setItem('neon-current',n);msg.textContent='登录成功';render()}function submitScore(){let n=me(),v=+newscore.value;if(!n||!v)return msg.textContent='请先登录并输入分数';let u=users();u[n].scores.push({score:v,time:new Date().toLocaleString()});save(u);render()}function render(){let n=me(),u=users();user.textContent=n||'未登录';history.innerHTML=n?(u[n].scores.slice().reverse().map(x=>`<li>${x.score} 分　${x.time}</li>`).join('')||'<li>暂无战绩</li>'):'请先登录';let all=[];Object.entries(u).forEach(([name,d])=>d.scores.forEach(x=>all.push({name,score:x.score})));rank.innerHTML=all.sort((a,b)=>b.score-a.score).slice(0,20).map((x,i)=>`<li>#${i+1}　${x.name}　<strong>${x.score}</strong></li>`).join('')||'<li>暂无排行数据</li>'}render()</script>
